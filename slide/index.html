<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elevenified - Demo</title>
    <link rel="icon" type="image/svg+xml" href="../assets/icons/fav-icon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep-slate: #1a1c20;
            --foreground: #f5f5f7;
            --foreground-muted: #8e8e93;
            --neon-volt: #39ff14;
            --synergy-gold: #ffd700;
            --synergy-blue: #00c9ff;
            --border-industrial: #3d3d42;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-deep-slate);
            color: var(--foreground);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navigation */
        .nav {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-industrial);
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .nav-logo img {
            height: 40px;
        }

        .nav-brand {
            font-weight: 800;
            font-size: 1.4rem;
            background: linear-gradient(135deg, var(--synergy-gold), var(--synergy-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-link {
            color: var(--foreground);
            text-decoration: none;
            padding: 10px 20px;
            border: 1px solid var(--border-industrial);
            border-radius: 8px;
            transition: all 0.2s;
        }

        .nav-link:hover {
            background: var(--neon-volt);
            color: var(--bg-deep-slate);
            border-color: var(--neon-volt);
        }

        /* Main Content */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 12px;
            text-align: center;
            background: linear-gradient(135deg, var(--synergy-gold), var(--neon-volt));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--foreground-muted);
            font-size: 1.1rem;
            margin-bottom: 40px;
            text-align: center;
        }

        .video-container {
            width: 100%;
            max-width: 1000px;
            aspect-ratio: 16/9;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(57, 255, 20, 0.1);
            border: 2px solid var(--border-industrial);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Footer CTA */
        .cta {
            text-align: center;
            padding: 40px 20px;
        }

        .cta-text {
            color: var(--foreground-muted);
            margin-bottom: 16px;
        }

        .cta-button {
            display: inline-block;
            padding: 16px 32px;
            font-size: 1.1rem;
            font-weight: 600;
            background: linear-gradient(135deg, var(--neon-volt), #32cd32);
            color: var(--bg-deep-slate);
            text-decoration: none;
            border-radius: 12px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(57, 255, 20, 0.3);
        }

        /* Mobile */
        @media (max-width: 640px) {
            .nav {
                padding: 16px 20px;
            }

            .nav-brand {
                font-size: 1.2rem;
            }

            h1 {
                font-size: 1.8rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .video-container {
                border-radius: 12px;
            }
        }
    </style>
</head>

<body>
    <nav class="nav">
        <a href="https://www.elevenified.com" class="nav-logo">
            <img src="../assets/icons/master-icon.svg" alt="Elevenified">
            <span class="nav-brand">Elevenified</span>
        </a>
        <a href="mailto:siddharth@elevenified.com" class="nav-link">Contact</a>
    </nav>

    <main class="main">
        <h1>Quick Setup Guide</h1>
        <p class="subtitle">See Elevenified in action — for Admins and Workers</p>

        <div class="video-container">
            <video controls autoplay muted playsinline>
                <source src="../assets/video/setup-guide.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
    </main>

    <section class="cta">
        <p class="cta-text">Ready to amplify your factory's knowledge?</p>
        <a href="https://forms.gle/ghjHV3ko32tfwD1J9" target="_blank" class="cta-button">
            Apply for Pilot Partnership →
        </a>
    </section>
</body>

</html>
